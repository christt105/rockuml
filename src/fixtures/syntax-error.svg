<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="439px" preserveAspectRatio="none" style="width:534px;height:439px;background:#000000;" version="1.1" viewBox="0 0 534 439" width="534px" zoomAndPan="magnify"><defs/><g><rect fill="#120209" height="1" style="stroke:#120209;stroke-width:1;" width="1" x="0" y="0"/><rect fill="#FFFFFF" height="236.7344" style="stroke:#FFFFFF;stroke-width:1;" width="533.4023" x="0" y="0"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="125.4023" x="5" y="17.6328">Welcome to PlantUML!</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="3.334" x="5" y="33.8281">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="242.3203" x="5" y="50.0234">You can start with a simple UML Diagram like:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="3.334" x="5" y="66.2188">&#160;</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="102" x="5" y="82.4141">Bob-&gt;Alice:&#160;Hello</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="3.334" x="5" y="98.6094">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="11.7422" x="5" y="114.8047">Or</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="3.334" x="5" y="131">&#160;</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="78" x="5" y="147.1953">class&#160;Example</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="3.334" x="5" y="163.3906">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="295.9688" x="5" y="179.5859">You will find more information about PlantUML syntax on</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" text-decoration="underline" textLength="113.8359" x="304.5664" y="179.5859">https://plantuml.com</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="3.334" x="5" y="195.7813">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="89.6367" x="5" y="211.9766">(Details by typing</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="42" x="98.2344" y="211.9766">license</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="45.7852" x="143.832" y="211.9766">keyword)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="3.334" x="5" y="228.1719">&#160;</text><image height="71" width="80" x="447.4023" xlink:href="data:image/png;base64," y="6"/><rect fill="#000000" height="201.1484" style="stroke:#000000;stroke-width:1;" width="533.4023" x="0" y="236.7344"/><text fill="#33FF02" font-family="sans-serif" font-size="12" font-style="italic" font-weight="bold" lengthAdjust="spacing" textLength="109.8281" x="5" y="253.7344">PlantUML 1.2026.2</text><text fill="#33FF02" font-family="sans-serif" font-size="12" font-style="italic" font-weight="bold" lengthAdjust="spacing" textLength="3.334" x="5" y="269.9297">&#160;</text><text fill="#33FF02" font-family="sans-serif" font-size="12" font-style="italic" font-weight="bold" lengthAdjust="spacing" textLength="311.9414" x="5" y="286.125">This version of PlantUML is 312 days old, so you should</text><text fill="#33FF02" font-family="sans-serif" font-size="12" font-style="italic" font-weight="bold" lengthAdjust="spacing" textLength="318.5508" x="5" y="302.3203">consider upgrading from https://plantuml.com/download</text><rect fill="#33FF02" height="23.8945" style="stroke:#33FF02;stroke-width:1;" width="214.7754" x="5" y="314.5156"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="212.7754" x="6" y="329.5156">[From syntax-error.puml (line 3) ]</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="3.8896" x="5" y="352.4102">&#160;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="65.7344" x="5" y="371.3047">@startuml</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="163.666" x="5" y="390.1992">Alice -&gt; Bob : Handshake</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="212.4883" x="5" y="409.0938">this is definitely not PlantUML !!!</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="318.2539" x="9.1973" y="427.9883">Syntax Error? (Assumed diagram type: sequence)</text></g></svg>